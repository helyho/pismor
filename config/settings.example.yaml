# 画像系统配置示例。复制为 settings.yaml 后按环境修改；
# api_key_env 指向的密钥从环境变量读取，不落配置文件。
db_path: ./data/index.db          # 主库路径；管理后台只读，修改需重启
taxonomy_path: ./config/taxonomy.yaml  # 词表路径；配置中心可编辑，保存后热生效

llm:
  endpoint: "http://10.242.0.11:8080/v1/"  # OpenAI 兼容接口根地址
  model: "auto"                    # 模型名；网关支持 auto 路由
  api_key_env: LLM_API_KEY        # 读取密钥的环境变量名；真实密钥不写入文件
  timeout_seconds: 120            # 单次请求超时；结构化输出慢模型建议 ≥120
  retries: 1                      # transport 异常/429/5xx 额外重试次数
  retry_backoff_seconds: 0.5      # 重试退避基数（指数增长；429 时取 Retry-After 较大者）
  log_preview_chars: 2048         # 响应日志预览长度
  user_agent: ~                   # 配置后请求头注入 User-Agent（网关 UA 白名单场景）；~ = httpx 原生 UA
  structured_output_param: "response_format"   # 参数名；置空 "" 则不带；三家均用 response_format
  structured_output_type: "json_object"        # json_schema=OpenAI 强约束；json_object=DeepSeek/GLM 仅保证合法 JSON

embedding:
  enabled: true                  # 启用后装配增加向量召回；关闭则只走词面匹配
  endpoint: "http://10.11.11.108:8000/v1/embeddings"  # 嵌入接口地址
  model: "BAAI/bge-m3"             # 嵌入模型名；须与 dimensions 匹配
  api_key_env: EMBEDDING_API_KEY   # 读取密钥的环境变量名；真实密钥不写入文件
  dimensions: 1024                # 须与模型输出一致；变更触发全量重嵌入
  batch_size: 32                   # 单次嵌入请求批量
  timeout_seconds: 30              # 单次嵌入请求超时（秒）
  min_similarity: 0.5              # 相关集向量召回最低 cosine 相似度（-1=不过滤）

gate:  # 本段及以下各段可整体省略，缺省即默认值
  auto_min: 0.85                  # ≥此值且 explicit 直通入库
  review_min: 0.6                 # ≥此值入复核队列，之下丢弃
  inferred_cap: 0.8               # inferred 候选置信压顶

pipeline:
  known_ids_limit: 200            # 抽取时已有条目加载上限
  reinforce_top_k: 20             # 无变化轮话题强化条数上限
  trigger_long_message: 300       # 消息长度突变阈值（字符）
  max_body_chars: 200             # 候选 body 截断长度
  trigger_explicit_keywords:  # 命中任一关键词即零阈值直通抽取；可整体替换或追加业务词
    - "记住"                      # 记住我喜欢深色主题
    - "以后"                      # 以后都用 Python
    - "别再"                      # 别再给我推广告
    - "不要"                      # 不要在回复里加 emoji
    - "默认"                      # 默认用浅色主题
    - "总是"                      # 总是把表格转成脚本
    - "永远"                      # 永远不要用那个工具
    - "remember"                  # remember that I prefer dark mode
    - "remember that"
    - "from now on"               # from now on use Python 3.12
    - "always"                    # always answer in English
    - "never"                     # never use tabs for indentation
    - "stop"                      # stop generating Excel formulas
    - "don't"                     # don't add emoji in replies
    - "do not"                    # do not use that tool
    - "prefer"                    # I prefer concise answers
    - "keep in mind"              # keep in mind I'm in UTC+8
    - "going forward"             # going forward, use formal tone

aggregator:
  degrade_days: 90                # 无强化天数超过此值参与降级
  degrade_confidence: 0.7         # 置信低于此值参与降级

assembler:
  taboo_budget_share: 0.6         # merge_task 时 taboo 预算占比
  taboo_merge_threshold: 40       # taboo 存活条数超此值触发归并任务（装配与日批同源）
  tokenizer: jieba                # BM25 词法索引分词器：jieba | bigram（切换后需重跑 scripts/rebuild_fts.py）
  related_top_k: 20               # 相关集召回条数
  half_life_days: 30              # 强化时效半衰期
  clarify_ttl_days: 7             # 新建澄清 pending 的 TTL 默认

intake:
  max_content_chars: 8192         # 事件 content 上限

backup:
  root: ./backups                 # 备份根：db/ 为 SQLite 快照，config/ 为配置历史
  keep: 30                        # 快照滚动保留份数

serve:
  daily_interval_seconds: 86400   # 日批循环间隔
